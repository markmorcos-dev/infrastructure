name: test-scripts

on:
  pull_request:
    paths: ["scripts/**", "k8s/**", ".github/workflows/test-scripts.yaml"]
  push:
    branches: [main]
    paths: ["scripts/**", "k8s/**", ".github/workflows/test-scripts.yaml"]

jobs:
  bootstrap-trash-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/tests/bootstrap-trash-secrets.test.sh

  immich-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -c 'import yaml' || pip install pyyaml
      - run: bash scripts/tests/immich-manifest.test.sh
