# One-time bootstrap for the birthday RSVP backend (markmorcos/portfolio):
# creates the `birthday` database + least-privilege `birthday_app` role on the
# native Postgres (m720q) and the portfolio/database-secrets Secret the
# birthday-api Deployment reads. Safe to re-run (bails out once the Secret
# exists).
#
# Credentials: uses the existing admin DATABASE_URL from the cluster (same
# one the nightly backups use). If that role can't CREATE DATABASE/ROLE, add
# a POSTGRES_SUPERUSER_PASSWORD repo secret (POSTGRES_PASSWORD from
# bootstrap/.env) and re-run — it takes precedence. Delete the workflow (and
# that secret) after the party if you like — nothing else references them.

name: bootstrap-birthday

on:
  workflow_dispatch: {}

jobs:
  bootstrap:
    runs-on: ubuntu-latest

    steps:
      - name: Configure VPN
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_CLIENT_SECRET }}
          tags: tag:ci

      - name: Configure Kubernetes
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Bootstrap database and Secret
        env:
          POSTGRES_SUPERUSER_PASSWORD: ${{ secrets.POSTGRES_SUPERUSER_PASSWORD }}
        run: |
          set -euo pipefail

          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null; }

          # Idempotence: if the secret exists, a previous run finished — bail out.
          if kubectl -n portfolio get secret database-secrets >/dev/null 2>&1; then
            echo "portfolio/database-secrets already exists — nothing to do."
            exit 0
          fi

          # Admin connection: repo secret takes precedence; otherwise reuse the
          # cluster's existing admin DATABASE_URL (what the nightly backup uses).
          # psql() below always connects with it but overrides the database name.
          if [ -n "$POSTGRES_SUPERUSER_PASSWORD" ]; then
            echo "using POSTGRES_SUPERUSER_PASSWORD repo secret"
            ADMIN_URL="postgresql://postgres:${POSTGRES_SUPERUSER_PASSWORD}@m720q:5432/postgres"
          else
            echo "using admin DATABASE_URL from backups/database-secrets"
            ADMIN_URL=$(kubectl -n backups get secret database-secrets -o jsonpath='{.data.DATABASE_URL}' | base64 -d)
          fi
          echo "::add-mask::$ADMIN_URL"

          # psql lacks a clean "same URL, other db" flag — rewrite the URL path.
          # Keeps any ?query params; appends the db if the URL has no path.
          url_with_db() {
            if printf '%s' "$ADMIN_URL" | grep -qE '://[^/]+/'; then
              printf '%s' "$ADMIN_URL" | sed -E "s#(postgres(ql)?://[^/]+)/[^?]*#\1/$1#"
            else
              printf '%s/%s' "$ADMIN_URL" "$1"
            fi
          }

          APP_PASSWORD=$(openssl rand -hex 24)
          echo "::add-mask::$APP_PASSWORD"

          PG_ADMIN=$(url_with_db postgres)

          # role (create or rotate password — hex password is SQL/URL-safe)
          if psql "$PG_ADMIN" -tAc "SELECT 1 FROM pg_roles WHERE rolname='birthday_app'" | grep -q 1; then
            psql "$PG_ADMIN" -q -c "ALTER ROLE birthday_app WITH LOGIN PASSWORD '$APP_PASSWORD'"
          else
            psql "$PG_ADMIN" -q -c "CREATE ROLE birthday_app WITH LOGIN PASSWORD '$APP_PASSWORD'"
          fi

          # database (CREATE DATABASE can't run in a transaction — plain psql -c)
          if ! psql "$PG_ADMIN" -tAc "SELECT 1 FROM pg_database WHERE datname='birthday'" | grep -q 1; then
            psql "$PG_ADMIN" -q -c "CREATE DATABASE birthday"
          fi
          psql "$PG_ADMIN" -q -c "REVOKE ALL ON DATABASE birthday FROM PUBLIC"
          psql "$PG_ADMIN" -q -c "GRANT CONNECT ON DATABASE birthday TO birthday_app"

          # schema objects + least-privilege grants (no DDL/DELETE for the app)
          psql "$(url_with_db birthday)" -v ON_ERROR_STOP=1 -q <<'SQL'
          REVOKE CREATE ON SCHEMA public FROM PUBLIC;
          GRANT USAGE ON SCHEMA public TO birthday_app;
          CREATE TABLE IF NOT EXISTS rsvps (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            name text NOT NULL,
            email text NOT NULL UNIQUE,
            plus_ones int NOT NULL DEFAULT 0 CHECK (plus_ones BETWEEN 0 AND 3),
            created_at timestamptz DEFAULT now()
          );
          GRANT SELECT, INSERT, UPDATE ON rsvps TO birthday_app;
          SQL

          # the Secret birthday-api reads (env valueFrom.secretKeyRef)
          kubectl create namespace portfolio --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n portfolio create secret generic database-secrets \
            --from-literal=DATABASE_URL="postgresql://birthday_app:${APP_PASSWORD}@postgres.data.svc.cluster.local:5432/birthday"

          echo "✅ birthday DB bootstrapped and portfolio/database-secrets created"
