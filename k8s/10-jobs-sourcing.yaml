# Daily job-sourcing kick for the jobs pipeline (markmorcos-dev/jobs). POSTs the
# service's /run/sourcing endpoint, which replies 202 and runs async: fetches
# listings (Adzuna, Arbeitnow, ATS watchlist), scores them against the profile,
# dedupes, and creates Wishlist entries in the Notion "Job Applications" DB.
# The endpoint is idempotent per listing (dedupe cache in Postgres), so re-runs
# are safe. Runs in the `jobs` namespace.
#
# Requires a secret `jobs-cron` with key CRON_SECRET, and the SAME value set as
# CRON_SECRET in the jobs deployment env (the endpoint validates the bearer).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: jobs-sourcing
  namespace: jobs
spec:
  schedule: "47 5 * * *" # daily 05:47 UTC (07:47 Berlin summer)
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 300
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: jobs-sourcing
              image: curlimages/curl:8.10.1
              env:
                - name: CRON_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: jobs-cron
                      key: CRON_SECRET
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { memory: 256Mi }
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  curl -sfSL -X POST \
                    -H "Authorization: Bearer ${CRON_SECRET}" \
                    "http://jobs-jobs-service.jobs.svc.cluster.local:3000/run/sourcing"
